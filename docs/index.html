<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página web en Mantenimiento | Alaya Yoga Mutilva</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Página web en mantenimiento. Próximamente volveremos. Disculpen las molestias.">
    <link rel="icon" href="favicon.ico" sizes="32x32">
    <link rel="icon" href="favicon.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        :root {
            --bg: #F4EEE9;
            --text: #2B2630;
            --primary: #6E4E78;
            --contrast: #51695F;
            --white: #FFFFFF;
            --shadow: 0 18px 50px rgba(43, 38, 48, 0.10);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Mulish', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .skip-link {
            position: absolute;
            top: -100%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--contrast);
            color: var(--white);
            padding: 0.8rem 1.5rem;
            border-radius: 0 0 8px 8px;
            z-index: 100000;
            font-weight: 600;
            text-decoration: none;
            transition: top 0.3s ease;
        }

        .skip-link:focus {
            top: 0;
        }

        main {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .maintenance-card {
            background: var(--white);
            padding: clamp(2rem, 6vw, 4rem) clamp(1.5rem, 5vw, 3.5rem);
            border-radius: 28px;
            box-shadow: var(--shadow);
            max-width: 720px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
            font-weight: 600;
            font-size: clamp(1.8rem, 4.6vw, 3.2rem);
            line-height: 1.15;
            color: var(--primary);
            margin-bottom: 1.2rem;
        }

        p {
            font-size: clamp(1.05rem, 1.8vw, 1.25rem);
            color: #5C5560;
            margin-bottom: 1.6rem;
        }

        .message {
            font-weight: 600;
            color: var(--text);
            font-size: clamp(1.1rem, 2vw, 1.35rem);
        }

        .brand {
            margin-top: 2rem;
            font-size: 0.95rem;
            color: #6E6775;
            letter-spacing: 0.04em;
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
    <main id="main-content">
        <div class="maintenance-card">
            <h1>Página web en Mantenimiento</h1>
            <p class="message">Próximamente volveremos.<br>Disculpen las molestias.</p>
            <p>Estamos realizando mejoras en la web. Si necesitas contactar con Alaya Yoga Mutilva, escríbenos por WhatsApp.</p>
            <p class="brand">Alaya Yoga Mutilva · Mutilva, Navarra</p>
        </div>
    </main>
</body>
</html>
